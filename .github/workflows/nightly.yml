name: Nightly Build

on:
  repository_dispatch:
    types: [nightly]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (commit SHA or branch, defaults to master)"
        required: false
        default: "master"
        type: string
      skip_windows:
        description: "Skip optional Windows validation jobs"
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runners:
    name: Load Runner Config
    uses: ./.github/workflows/_runners.yml

  prepare:
    name: Prepare Nightly Release
    needs: [runners]
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    permissions:
      contents: write
    outputs:
      nightly_version: ${{ steps.version.outputs.nightly_version }}
      ref: ${{ steps.source_commit.outputs.sha }}
      source_commit_sha: ${{ steps.source_commit.outputs.sha }}
      skip_windows: ${{ steps.params.outputs.skip_windows }}
      package_matrix: ${{ steps.package-matrix.outputs.matrix }}
      release_body: ${{ steps.changelog.outputs.notes }}
    steps:
      - name: Get build parameters
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
            skip_windows='${{ github.event.client_payload.skip_windows }}'
          else
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            skip_windows='${{ inputs.skip_windows }}'
          fi

          skip_windows="$(printf '%s' "${skip_windows:-false}" | tr '[:upper:]' '[:lower:]')"
          case "${skip_windows}" in
            true|1|yes)
              echo "skip_windows=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip_windows=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build package matrix
        id: package-matrix
        shell: bash
        env:
          SKIP_WINDOWS: ${{ steps.params.outputs.skip_windows }}
          RUNNER_MACOS: ${{ needs.runners.outputs.macos_build }}
          RUNNER_WINDOWS: ${{ needs.runners.outputs.windows }}
        run: |
          set -euo pipefail

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          include = [
              {
                  "name": "macOS (aarch64)",
                  "os": os.environ["RUNNER_MACOS"],
                  "target": "aarch64-apple-darwin",
                  "os_target": "darwin",
                  "arch": "aarch64",
                  "tauri_args": "--target aarch64-apple-darwin",
              }
          ]

          if os.environ["SKIP_WINDOWS"] != "true":
              include.append(
                  {
                      "name": "Windows (x86_64)",
                      "os": os.environ["RUNNER_WINDOWS"],
                      "target": "x86_64-pc-windows-msvc",
                      "os_target": "windows",
                      "arch": "x86_64",
                      "tauri_args": "--target x86_64-pc-windows-msvc --bundles nsis",
                  }
              )

          print(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}")
          PY

      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.params.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve source commit SHA
        id: source_commit
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_COMMIT_SHA="$(git rev-parse HEAD)"
          if [[ ! "${SOURCE_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source commit SHA: ${SOURCE_COMMIT_SHA}" >&2
            exit 1
          fi

          echo "sha=${SOURCE_COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Source commit SHA: ${SOURCE_COMMIT_SHA}"

      - name: Compute nightly version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          v = json.loads(Path("package.json").read_text(encoding="utf-8")).get("version","").strip()
          print(v, end='')
          PY
          )"

          if [[ ! "${BASE_VERSION}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Invalid base version in package.json: ${BASE_VERSION}" >&2
            exit 1
          fi

          MAJOR="${BASE_VERSION%%.*}"
          REST="${BASE_VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"

          NEXT_PATCH="$((PATCH + 1))"

          # 首个 SHA-aware Nightly 需要高于旧版 -nightly，之后继续复用固定版本。
          NIGHTLY_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-nightly.1"
          echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Nightly version: ${NIGHTLY_VERSION}"

      - name: Build nightly release body
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_REF="${{ steps.source_commit.outputs.sha }}"
          LAST_STABLE_TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"

          if [[ -n "${LAST_STABLE_TAG}" ]]; then
            COMPARE_URL="https://github.com/Voice-Wise/VoiceWise/compare/${LAST_STABLE_TAG}...${CURRENT_REF}"
          else
            COMPARE_URL=""
          fi

          HEADER="## Nightly Build\n\n- Version: v${{ steps.version.outputs.nightly_version }}\n- Ref: ${CURRENT_REF}\n"
          if [[ -n "${COMPARE_URL}" ]]; then
            HEADER="${HEADER}- Compare: ${COMPARE_URL}\n"
          fi

          NOTES="${HEADER}\n\n## Changelog\n\nNightly changelog generation is skipped for this build.\n"

          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  test-frontend:
    name: Frontend Checks
    needs: [prepare]
    uses: ./.github/workflows/_frontend-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

  test:
    name: Test (macOS ARM64)
    needs: [runners, prepare]
    runs-on: ${{ needs.runners.outputs.macos }}
    steps:
      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@8f24390df009a496891208e5e36b8a1de1f45135 # v2.0.2
        with:
          bun-version: "1.3.2"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: nightly-test-${{ runner.os }}-aarch64-apple-darwin
          cache-on-failure: true
          cache-workspace-crates: false
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR

      - name: Run Rust tests
        run: bun run test:rust

      - name: Run functional tests (no API key)
        run: bun run test:functional

  test-windows:
    name: Test (Windows (x86_64))
    needs: [runners, prepare]
    if: ${{ needs.prepare.outputs.skip_windows != 'true' }}
    runs-on: ${{ needs.runners.outputs.windows }}
    steps:
      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Enable git long paths (Windows)
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows"
        shell: pwsh
        run: |
          $ioRoot = $env:RUNNER_TEMP
          $cargoHome = Join-Path $ioRoot "_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = Join-Path $ioRoot "_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@8f24390df009a496891208e5e36b8a1de1f45135 # v2.0.2
        with:
          bun-version: "1.3.2"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: nightly-test-${{ runner.os }}-x86_64-pc-windows-msvc
          cache-on-failure: true
          cache-workspace-crates: false
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR

      - name: Run Rust tests
        run: bun run test:rust

      - name: Run functional tests (no API key)
        run: bun run test:functional

  create-release:
    name: Create Build Draft
    needs: [runners, prepare]
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      nightly_version: ${{ needs.prepare.outputs.nightly_version }}
      ref: ${{ needs.prepare.outputs.ref }}
      source_commit_sha: ${{ needs.prepare.outputs.source_commit_sha }}
      skip_windows: ${{ needs.prepare.outputs.skip_windows }}
    steps:
      - name: Checkout release repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create private build draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ needs.prepare.outputs.release_body }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.nightly_version }}
        run: python3 scripts/release-publication.py create --channel nightly

  package:
    name: Package (${{ matrix.name }})
    needs: [prepare, create-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      LIVETYPE_BUILD_COMMIT_SHA: ${{ needs.create-release.outputs.source_commit_sha }}
      SENTRY_RELEASE: voicewise@${{ needs.create-release.outputs.nightly_version }}
      SENTRY_DIST: nightly-${{ github.run_number }}-${{ github.run_attempt }}
      VITE_SENTRY_RELEASE: voicewise@${{ needs.create-release.outputs.nightly_version }}
      VITE_SENTRY_DIST: nightly-${{ github.run_number }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.package_matrix) }}

    steps:
      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.create-release.outputs.ref }}

      - name: Checkout release support scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/release
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Prepare persistent local build cache
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: bash .release-tools/scripts/runner/prepare-build-cache.sh

      - name: Enable git long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows"
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ioRoot = $env:RUNNER_TEMP
          $cargoHome = Join-Path $ioRoot "_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = Join-Path $ioRoot "_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Bun
        if: ${{ runner.environment != 'self-hosted' }}
        uses: oven-sh/setup-bun@8f24390df009a496891208e5e36b8a1de1f45135 # v2.0.2
        with:
          bun-version: "1.3.2"

      - name: Cache Bun
        if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.bun/install/cache
            ${{ runner.temp }}/_bun-cache
          key: ${{ runner.os }}-${{ matrix.target }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        if: ${{ runner.environment != 'self-hosted' }}
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: nightly-package-${{ runner.os }}-${{ matrix.target }}
          cache-on-failure: true
          cache-workspace-crates: false
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR

      - name: Patch version for nightly build
        env:
          NIGHTLY_VERSION: ${{ needs.create-release.outputs.nightly_version }}
        shell: bash
        run: |
          set -euo pipefail

          # Patch package.json, tauri.conf.json, and Cargo.toml
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          version = os.environ["NIGHTLY_VERSION"].strip()
          if not version:
              raise SystemExit("Missing NIGHTLY_VERSION")

          # Patch JSON files
          for path in ["package.json", "src-tauri/tauri.conf.json"]:
              p = Path(path)
              data = json.loads(p.read_text(encoding="utf-8"))
              data["version"] = version
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Patch Cargo.toml (replace version in [package] section)
          cargo_path = Path("src-tauri/Cargo.toml")
          content = cargo_path.read_text(encoding="utf-8")
          content = re.sub(
              r'^(version\s*=\s*")[^"]+(")',
              rf'\g<1>{version}\g<2>',
              content,
              count=1,
              flags=re.MULTILINE
          )
          cargo_path.write_text(content, encoding="utf-8")
          PY

      - name: Install NSIS (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if (Test-Path 'C:\Program Files (x86)\NSIS') {
            'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path 'C:\Program Files\NSIS') {
            'C:\Program Files\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Import Apple code signing cert (temporary keychain)
        if: ${{ runner.os == 'macOS' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: python3 .release-tools/scripts/runner/apple-signing.py prepare

      - name: Validate Apple notarization credentials
        if: ${{ runner.os == 'macOS' }}
        id: notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "::warning::Apple 公证凭据缺失，nightly 将继续产出已签名但未公证的 macOS 包。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOG_PATH="$RUNNER_TEMP/notarytool-history.log"
          if xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            >"$LOG_PATH" 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            cat "$LOG_PATH" >&2 || true
            echo "::warning::Apple 公证凭据校验失败，nightly 将继续产出已签名但未公证的 macOS 包。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + upload assets (macOS, notarized)
        if: ${{ runner.os == 'macOS' && steps.notarization.outputs.enabled == 'true' }}
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: "bun run tauri"
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.tauri_args }}
          assetNamePattern: "[name]_[version]_[platform]_[arch][ext]"

      - name: Build + upload assets (macOS, signed only)
        if: ${{ runner.os == 'macOS' && steps.notarization.outputs.enabled != 'true' }}
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tauriScript: "bun run tauri"
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.tauri_args }}
          assetNamePattern: "[name]_[version]_[platform]_[arch][ext]"

      - name: Build + upload assets (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: "bun run tauri"
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.tauri_args }}
          assetNamePattern: "[name]_[version]_[platform]_[arch][ext]"

      - name: Collect debug symbols (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/sentry-debug/${{ matrix.target }}"
          SEARCH_ROOT="src-tauri/target/${{ matrix.target }}/release"
          mkdir -p "$OUTPUT_DIR"
          touch "$OUTPUT_DIR/.keep"

          if [[ -d "$SEARCH_ROOT" ]]; then
            while IFS= read -r -d '' symbol_dir; do
              cp -R "$symbol_dir" "$OUTPUT_DIR/"
            done < <(find "$SEARCH_ROOT" -type d -name '*.dSYM' -print0)
          fi

      - name: Collect debug symbols (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "sentry-debug/${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $outputDir ".keep") | Out-Null

          $searchRoots = @(
            "src-tauri/target/${{ matrix.target }}/release",
            (Join-Path $env:CARGO_TARGET_DIR "${{ matrix.target }}/release")
          )

          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Filter *.pdb -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination $outputDir -Force
              }
            }
          }

      - name: Upload source maps and debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_SOURCEMAP_DIR: ${{ runner.os == 'macOS' && 'dist' || 'sentry-no-sourcemaps' }}
          SENTRY_REQUIRE_SOURCEMAPS: ${{ runner.os == 'macOS' }}
          SENTRY_DEBUG_ROOT: ${{ runner.temp }}/sentry-debug
        run: bash .release-tools/scripts/upload-sentry-release-assets.sh

      - name: Clean up Apple signing materials
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          if [[ -f .release-tools/scripts/runner/apple-signing.py ]]; then
            python3 .release-tools/scripts/runner/apple-signing.py cleanup
          fi

  publish-manifest:
    name: Publish Validated Release
    needs: [runners, create-release, test-frontend, test, test-windows, package]
    if: ${{ always() && needs.create-release.result == 'success' && needs.test.result == 'success' && needs.test-frontend.result == 'success' && needs.package.result == 'success' && (needs.create-release.outputs.skip_windows == 'true' || needs.test-windows.result == 'success') }}
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    permissions:
      contents: write
    steps:
      - name: Checkout release repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate manifest and publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.nightly_version }}
          SKIP_WINDOWS: ${{ needs.create-release.outputs.skip_windows }}
          SOURCE_COMMIT_SHA: ${{ needs.create-release.outputs.source_commit_sha }}
        run: python3 scripts/release-publication.py publish --channel nightly

  cleanup-draft:
    name: Clean Unpublished Draft
    needs: [runners, create-release, package, publish-manifest]
    if: ${{ always() && needs.create-release.outputs.release_id != '' }}
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    permissions:
      contents: write
    steps:
      - name: Checkout release repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Delete only this run's unpublished draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: python3 scripts/release-publication.py cleanup --channel nightly
