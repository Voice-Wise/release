name: Frontend Checks

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      build:
        default: false
        type: boolean
    secrets:
      PRIVATE_REPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (Node 24, direct GitHub downloads)
        with:
          bun-version: "1.3.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend unit tests
        run: bun run test:fe

      - name: Build frontend
        if: ${{ inputs.build }}
        run: bun run build
