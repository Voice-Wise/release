name: Local Runner Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify local runner and signing
    runs-on: [self-hosted, macOS, ARM64, voicewise-m4]
    timeout-minutes: 15
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify tools and record keychain state
        shell: bash
        run: |
          set -euo pipefail
          bun --version
          node --version
          rustc --version
          xcrun --find notarytool
          security default-keychain -d user > "$RUNNER_TEMP/default-keychain.before"
          security list-keychains -d user > "$RUNNER_TEMP/search-keychains.before"
          python3 -m unittest discover -s scripts/runner -p 'test_*.py'

      - name: Import certificate from existing GitHub Secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: python3 scripts/runner/apple-signing.py prepare

      - name: Verify real code signing and notarization credentials
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          cp /usr/bin/true "$RUNNER_TEMP/voicewise-signing-check"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/voicewise-signing-check"
          codesign --verify --strict "$RUNNER_TEMP/voicewise-signing-check"
          xcrun notarytool history --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            > /dev/null

      - name: Clean up and verify user keychain state
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/runner/apple-signing.py cleanup
          security default-keychain -d user > "$RUNNER_TEMP/default-keychain.after"
          security list-keychains -d user > "$RUNNER_TEMP/search-keychains.after"
          diff -u "$RUNNER_TEMP/default-keychain.before" "$RUNNER_TEMP/default-keychain.after"
          diff -u "$RUNNER_TEMP/search-keychains.before" "$RUNNER_TEMP/search-keychains.after"
          test ! -f "$VOICEWISE_SIGNING_STATE_DIR/state.json"
          test ! -f "$VOICEWISE_SIGNING_STATE_DIR/build.keychain-db"
          rm -f "$RUNNER_TEMP/voicewise-signing-check"
