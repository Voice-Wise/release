name: Release Build

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (tag or branch)"
        required: true
        type: string
      version:
        description: "Version to release (e.g., 0.1.0)"
        required: true
        type: string
      skip_windows:
        description: "Skip Windows jobs and packaging"
        required: false
        default: false
        type: boolean

jobs:
  runners:
    name: Load Runner Config
    uses: ./.github/workflows/_runners.yml

  prepare:
    name: Prepare Release
    needs: [runners]
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    permissions:
      contents: write
    outputs:
      release_body: ${{ steps.changelog.outputs.notes }}
      version: ${{ steps.params.outputs.version }}
      ref: ${{ steps.params.outputs.ref }}
      skip_windows: ${{ steps.params.outputs.skip_windows }}
    steps:
      - name: Get build parameters
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
            skip_windows='${{ github.event.client_payload.skip_windows }}'
          else
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            skip_windows='${{ inputs.skip_windows }}'
          fi

          skip_windows="$(printf '%s' "${skip_windows:-false}" | tr '[:upper:]' '[:lower:]')"
          case "${skip_windows}" in
            true|1|yes)
              echo "skip_windows=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip_windows=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.params.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify stable tag + version consistency
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import json
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ.get("BUILD_REF", "")
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Expected stable tag vX.Y.Z, got: {tag}")

          expected = tag.removeprefix("v")
          pkg_version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          tauri_version = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))["version"]
          cargo_version = tomllib.loads(Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]

          versions = {
              "package.json": pkg_version,
              "src-tauri/tauri.conf.json": tauri_version,
              "src-tauri/Cargo.toml": cargo_version,
          }

          mismatch = {k: v for k, v in versions.items() if v != expected}
          if mismatch:
              joined = ", ".join(f"{k}={v}" for k, v in mismatch.items())
              raise SystemExit(f"Version mismatch: tag={expected}, {joined}")
          print(f"Version OK: {expected}")
          PY
        env:
          BUILD_REF: ${{ steps.params.outputs.ref }}

      - name: Generate changelog from commits
        id: changelog
        shell: bash
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail

          CURRENT_TAG="${{ steps.params.outputs.ref }}"
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "${CURRENT_TAG}^" 2>/dev/null || true)"

          if [[ -n "${PREV_TAG}" ]]; then
            RANGE="${PREV_TAG}..HEAD"
            COMPARE_URL="https://github.com/Voice-Wise/VoiceWise/compare/${PREV_TAG}...${CURRENT_TAG}"
          else
            RANGE="HEAD"
            COMPARE_URL=""
          fi

          # Get commit messages
          COMMITS="$(git log --reverse --no-merges --format='%s' ${RANGE} | grep -v '^chore(release):' || true)"

          if [[ -z "$COMMITS" ]]; then
            NOTES="## Changelog

          - No changes.
          "
          else
            # Build the prompt
            PROMPT="Based on the following git commit messages, generate a concise and user-friendly changelog in BOTH Chinese (Simplified) and English. First output the Chinese version, then add a horizontal rule (---), then output the English version. Group changes by category (e.g., 鉁?鏂板姛鑳?New Features, 馃悰 闂淇/Bug Fixes, 鈿?鎬ц兘浼樺寲/Performance, 馃敡 鍏朵粬鏀硅繘/Other Improvements). Only include meaningful changes, skip trivial commits. Use clear, non-technical language. Output ONLY the changelog content in markdown format without any preamble.

          Commit messages:
          $COMMITS"

            # Call DashScope API
            RESPONSE=$(curl -s --max-time 30 "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions" \
              -H "Authorization: Bearer $DASHSCOPE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg prompt "$PROMPT" '{
                "model": "qwen3.6-plus",
                "messages": [{"role": "user", "content": $prompt}],
                "max_tokens": 1024
              }')" 2>/dev/null || echo "{}")

            CHANGELOG=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)

            if [[ -z "$CHANGELOG" ]]; then
              # Fallback to generic message (don't expose raw commit messages)
              NOTES="## Changelog

          See release for details. / 璇﹁鍙戝竷璇存槑銆?
          "
            else
              NOTES="## Changelog

          $CHANGELOG
          "
            fi
          fi

          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  test-frontend:
    name: Frontend Checks
    needs: [prepare]
    uses: ./.github/workflows/_frontend-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

  test:
    name: Test (macOS ARM64)
    needs: [runners, prepare]
    runs-on: ${{ needs.runners.outputs.macos }}
    steps:
      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Enable git long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows (use D: drive)"
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $cargoHome = "D:/a/_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = "D:/a/_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@8f24390df009a496891208e5e36b8a1de1f45135 # v2.0.2
        with:
          bun-version: "1.3.2"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: release-test-${{ runner.os }}-aarch64-apple-darwin
          cache-on-failure: true
          cache-workspace-crates: false
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR

      - name: Run Rust tests
        run: bun run test:rust

      - name: Run functional tests (no API key)
        run: bun run test:functional

  test-windows:
    name: Test (Windows (x86_64))
    needs: [runners, prepare]
    if: ${{ needs.prepare.outputs.skip_windows != 'true' }}
    runs-on: ${{ needs.runners.outputs.windows }}
    steps:
      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Enable git long paths (Windows)
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows (use D: drive)"
        shell: pwsh
        run: |
          $cargoHome = "D:/a/_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = "D:/a/_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@8f24390df009a496891208e5e36b8a1de1f45135 # v2.0.2
        with:
          bun-version: "1.3.2"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: release-test-${{ runner.os }}-x86_64-pc-windows-msvc
          cache-on-failure: true
          cache-workspace-crates: false
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR

      - name: Run Rust tests
        run: bun run test:rust

      - name: Run functional tests (no API key)
        run: bun run test:functional

  cloud-regression:
    name: Cloud Regression (${{ matrix.name }})
    needs: [runners, prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: ${{ needs.runners.outputs.macos }}

    env:
      VOICEWISE_TEST_AUTH_JSON: ${{ secrets.VOICEWISE_TEST_AUTH_JSON }}

    steps:
      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Enable git long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows (use D: drive)"
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $cargoHome = "D:/a/_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = "D:/a/_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@8f24390df009a496891208e5e36b8a1de1f45135 # v2.0.2
        with:
          bun-version: "1.3.2"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: release-cloud-${{ runner.os }}
          cache-on-failure: true
          cache-workspace-crates: false
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR

      - name: Run cloud functional tests (API key)
        run: bun run test:functional:cloud

  cloud-regression-windows:
    name: Cloud Regression (Windows)
    needs: [runners, prepare]
    if: ${{ needs.prepare.outputs.skip_windows != 'true' }}
    runs-on: ${{ needs.runners.outputs.windows }}
    env:
      VOICEWISE_TEST_AUTH_JSON: ${{ secrets.VOICEWISE_TEST_AUTH_JSON }}
    steps:
      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Enable git long paths (Windows)
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows (use D: drive)"
        shell: pwsh
        run: |
          $cargoHome = "D:/a/_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = "D:/a/_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@8f24390df009a496891208e5e36b8a1de1f45135 # v2.0.2
        with:
          bun-version: "1.3.2"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: release-cloud-${{ runner.os }}
          cache-on-failure: true
          cache-workspace-crates: false
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR

      - name: Run cloud functional tests (API key)
        run: bun run test:functional:cloud

  create-release:
    name: Create Build Draft
    needs: [runners, prepare]
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      skip_windows: ${{ needs.prepare.outputs.skip_windows }}
    steps:
      - name: Checkout release repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create private build draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ needs.prepare.outputs.release_body }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release-publication.py create --channel stable

  package:
    name: Package (${{ matrix.name }})
    needs: [runners, create-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      SENTRY_RELEASE: voicewise@${{ needs.create-release.outputs.version }}
      SENTRY_DIST: stable-${{ github.run_number }}-${{ github.run_attempt }}
      VITE_SENTRY_RELEASE: voicewise@${{ needs.create-release.outputs.version }}
      VITE_SENTRY_DIST: stable-${{ github.run_number }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (aarch64)
            os: ${{ needs.runners.outputs.macos_build }}
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin

    steps:
      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.create-release.outputs.ref }}

      - name: Checkout release support scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/release
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Prepare persistent local build cache
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: bash .release-tools/scripts/runner/prepare-build-cache.sh

      - name: Enable git long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows (use D: drive)"
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $cargoHome = "D:/a/_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = "D:/a/_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Bun
        if: ${{ runner.environment != 'self-hosted' }}
        uses: oven-sh/setup-bun@8f24390df009a496891208e5e36b8a1de1f45135 # v2.0.2
        with:
          bun-version: "1.3.2"

      - name: Cache Bun
        if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.bun/install/cache
            D:/a/_bun-cache
          key: ${{ runner.os }}-${{ matrix.target }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        if: ${{ runner.environment != 'self-hosted' }}
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: release-package-${{ runner.os }}-${{ matrix.target }}
          cache-on-failure: true
          cache-workspace-crates: false
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR

      - name: Install NSIS (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if (Test-Path 'C:\Program Files (x86)\NSIS') {
            'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path 'C:\Program Files\NSIS') {
            'C:\Program Files\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Import Apple code signing cert (temporary keychain)
        if: ${{ runner.os == 'macOS' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: python3 .release-tools/scripts/runner/apple-signing.py prepare

      - name: Build + upload assets (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: "bun run tauri"
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.tauri_args }}
          assetNamePattern: "[name]_[version]_[platform]_[arch][ext]"

      - name: Build + upload assets (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: "bun run tauri"
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.tauri_args }}
          assetNamePattern: "[name]_[version]_[platform]_[arch][ext]"

      - name: Collect debug symbols (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/sentry-debug/${{ matrix.target }}"
          SEARCH_ROOT="src-tauri/target/${{ matrix.target }}/release"
          mkdir -p "$OUTPUT_DIR"
          touch "$OUTPUT_DIR/.keep"

          if [[ -d "$SEARCH_ROOT" ]]; then
            while IFS= read -r -d '' symbol_dir; do
              cp -R "$symbol_dir" "$OUTPUT_DIR/"
            done < <(find "$SEARCH_ROOT" -type d -name '*.dSYM' -print0)
          fi

      - name: Collect debug symbols (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "sentry-debug/${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $outputDir ".keep") | Out-Null

          $searchRoots = @(
            "src-tauri/target/${{ matrix.target }}/release",
            (Join-Path $env:CARGO_TARGET_DIR "${{ matrix.target }}/release")
          )

          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Filter *.pdb -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination $outputDir -Force
              }
            }
          }

      - name: Upload source maps and debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_SOURCEMAP_DIR: ${{ runner.os == 'macOS' && 'dist' || 'sentry-no-sourcemaps' }}
          SENTRY_REQUIRE_SOURCEMAPS: ${{ runner.os == 'macOS' }}
          SENTRY_DEBUG_ROOT: ${{ runner.temp }}/sentry-debug
        run: bash .release-tools/scripts/upload-sentry-release-assets.sh

      - name: Clean up Apple signing materials
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          if [[ -f .release-tools/scripts/runner/apple-signing.py ]]; then
            python3 .release-tools/scripts/runner/apple-signing.py cleanup
          fi

  package-windows:
    name: Package (Windows (x86_64))
    needs: [runners, create-release]
    if: ${{ needs.create-release.outputs.skip_windows != 'true' }}
    runs-on: ${{ needs.runners.outputs.windows }}
    permissions:
      contents: write
    env:
      SENTRY_RELEASE: voicewise@${{ needs.create-release.outputs.version }}
      SENTRY_DIST: stable-${{ github.run_number }}-${{ github.run_attempt }}
      VITE_SENTRY_RELEASE: voicewise@${{ needs.create-release.outputs.version }}
      VITE_SENTRY_DIST: stable-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Checkout private source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.create-release.outputs.ref }}

      - name: Checkout release support scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Voice-Wise/release
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Enable git long paths (Windows)
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows (use D: drive)"
        shell: pwsh
        run: |
          $cargoHome = "D:/a/_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = "D:/a/_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@8f24390df009a496891208e5e36b8a1de1f45135 # v2.0.2
        with:
          bun-version: "1.3.2"

      - name: Cache Bun
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.bun/install/cache
            D:/a/_bun-cache
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-pc-windows-msvc-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: release-package-${{ runner.os }}-x86_64-pc-windows-msvc
          cache-on-failure: true
          cache-workspace-crates: false
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR

      - name: Install NSIS (Windows)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if (Test-Path 'C:\Program Files (x86)\NSIS') {
            'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path 'C:\Program Files\NSIS') {
            'C:\Program Files\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build + upload assets (Windows)
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: "bun run tauri"
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target x86_64-pc-windows-msvc --bundles nsis
          assetNamePattern: "[name]_[version]_[platform]_[arch][ext]"

      - name: Collect debug symbols (Windows)
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "sentry-debug/x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $outputDir ".keep") | Out-Null

          $searchRoots = @(
            "src-tauri/target/x86_64-pc-windows-msvc/release",
            (Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc/release")
          )

          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Filter *.pdb -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination $outputDir -Force
              }
            }
          }

      - name: Upload source maps and debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_SOURCEMAP_DIR: ${{ runner.os == 'macOS' && 'dist' || 'sentry-no-sourcemaps' }}
          SENTRY_REQUIRE_SOURCEMAPS: ${{ runner.os == 'macOS' }}
          SENTRY_DEBUG_ROOT: ${{ runner.temp }}/sentry-debug
        run: bash .release-tools/scripts/upload-sentry-release-assets.sh

  publish-manifest:
    name: Publish Validated Release
    needs: [runners, create-release, test-frontend, test, test-windows, package, cloud-regression, cloud-regression-windows, package-windows]
    if: ${{ always() && needs.create-release.result == 'success' && needs.test.result == 'success' && needs.test-frontend.result == 'success' && needs.package.result == 'success' && (needs.create-release.outputs.skip_windows == 'true' || needs.test-windows.result == 'success') && needs.cloud-regression.result == 'success' && (needs.create-release.outputs.skip_windows == 'true' || (needs.cloud-regression-windows.result == 'success' && needs.package-windows.result == 'success')) }}
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    permissions:
      contents: write
    steps:
      - name: Checkout release repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate manifest and publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
          SKIP_WINDOWS: ${{ needs.create-release.outputs.skip_windows }}
        run: python3 scripts/release-publication.py publish --channel stable

  cleanup-draft:
    name: Clean Unpublished Draft
    needs: [runners, create-release, package, publish-manifest, package-windows]
    if: ${{ always() && needs.create-release.outputs.release_id != '' }}
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    permissions:
      contents: write
    steps:
      - name: Checkout release repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Delete only this run's unpublished draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: python3 scripts/release-publication.py cleanup --channel stable
