name: CI (Cross-Repo)
run-name: ci @ ${{ github.event.client_payload.sha || github.event.inputs.sha }}

on:
  repository_dispatch:
    types: [ci]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to test"
        required: true
        type: string
      ref:
        description: "Git ref (branch name)"
        required: false
        default: "master"
        type: string
      skip_windows:
        description: "Skip Windows CI jobs"
        required: false
        default: false
        type: boolean

# Dispatch github.ref points at release/main; group by the SOURCE branch instead.
# Unknown source branches and main/master must never cancel another commit.
concurrency:
  group: ci-${{ github.event.client_payload.sender_repo || 'Voice-Wise/VoiceWise' }}-${{ github.event.client_payload.ref || inputs.ref || github.run_id }}-${{ ((github.event.client_payload.ref || inputs.ref) == 'main' || (github.event.client_payload.ref || inputs.ref) == 'master' || !(github.event.client_payload.ref || inputs.ref)) && github.run_id || 'latest' }}
  cancel-in-progress: ${{ (github.event.client_payload.ref || inputs.ref) != '' && (github.event.client_payload.ref || inputs.ref) != 'main' && (github.event.client_payload.ref || inputs.ref) != 'master' }}

# Keep debug assertions and the complete test matrix; test binaries do not need
# DWARF/PDB symbols. Release-package profiles and uploaded symbols are unchanged.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test-frontend:
    name: Frontend Checks
    uses: ./.github/workflows/_frontend-tests.yml
    with:
      ref: ${{ github.event.client_payload.sha || inputs.sha }}
      build: true
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

  ci:
    name: Run CI (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.sha || inputs.sha }}

      - name: Enable git long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows"
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $cargoHome = Join-Path $env:RUNNER_TEMP "_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = Join-Path $env:RUNNER_TEMP "_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (Node 24)
        with:
          shared-key: tests-${{ runner.os }}
          cache-on-failure: true
          cache-bin: false
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR
            CARGO_PROFILE_DEV_DEBUG
            CARGO_PROFILE_TEST_DEBUG

      - name: Run Rust tests
        run: node scripts/test-rust.mjs

      - name: Run functional tests
        run: node scripts/test-functional.mjs

  ci-windows:
    name: Run CI (Windows)
    if: ${{ !contains(fromJSON('["true","1","yes"]'), format('{0}', github.event.client_payload.skip_windows || inputs.skip_windows || false)) }}
    runs-on: windows-latest
    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.sha || inputs.sha }}

      - name: Enable git long paths (Windows)
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows"
        shell: pwsh
        run: |
          $cargoHome = Join-Path $env:RUNNER_TEMP "_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = Join-Path $env:RUNNER_TEMP "_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (Node 24)
        with:
          shared-key: tests-${{ runner.os }}
          cache-on-failure: true
          cache-bin: false
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR
            CARGO_PROFILE_DEV_DEBUG
            CARGO_PROFILE_TEST_DEBUG

      - name: Run Rust tests
        run: node scripts/test-rust.mjs

      - name: Run functional tests
        # Windows main-thread stack must match the already-required cloud suite.
        # This changes only the functional binary link, not dependency compilation.
        shell: pwsh
        run: |
          cargo rustc --manifest-path src-tauri/Cargo.toml --features functional-tests --bin functional_suite --locked -- -C link-arg=/STACK:16777216
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:CARGO_TARGET_DIR/debug/functional_suite.exe" local
          exit $LASTEXITCODE
