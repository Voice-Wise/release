name: CI (Cross-Repo)
run-name: ci @ ${{ github.event.client_payload.sha || github.event.inputs.sha }}

on:
  repository_dispatch:
    types: [ci]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to test"
        required: true
        type: string
      ref:
        description: "Git ref (branch name)"
        required: false
        default: "master"
        type: string
      skip_windows:
        description: "Skip Windows CI jobs"
        required: false
        default: false
        type: boolean

# Dispatch github.ref points at release/main; group by the SOURCE branch instead.
# Unknown source branches and main/master must never cancel another commit.
concurrency:
  group: ci-${{ github.event.client_payload.sender_repo || 'Voice-Wise/VoiceWise' }}-${{ github.event.client_payload.ref || inputs.ref || github.run_id }}-${{ ((github.event.client_payload.ref || inputs.ref) == 'main' || (github.event.client_payload.ref || inputs.ref) == 'master' || !(github.event.client_payload.ref || inputs.ref)) && github.run_id || 'latest' }}
  cancel-in-progress: ${{ (github.event.client_payload.ref || inputs.ref) != '' && (github.event.client_payload.ref || inputs.ref) != 'main' && (github.event.client_payload.ref || inputs.ref) != 'master' }}

jobs:
  prepare:
    name: Prepare CI
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.params.outputs.sha }}
      ref: ${{ steps.params.outputs.ref }}
      skip_windows: ${{ steps.params.outputs.skip_windows }}
    steps:
      - name: Get parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "sha=${{ github.event.client_payload.sha }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.client_payload.ref }}" >> "$GITHUB_OUTPUT"
            skip_windows='${{ github.event.client_payload.skip_windows }}'
          else
            echo "sha=${{ github.event.inputs.sha }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
            skip_windows='${{ inputs.skip_windows }}'
          fi

          skip_windows="$(printf '%s' "${skip_windows:-false}" | tr '[:upper:]' '[:lower:]')"
          case "${skip_windows}" in
            true|1|yes)
              echo "skip_windows=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip_windows=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  test-frontend:
    name: Frontend Checks
    needs: [prepare]
    uses: ./.github/workflows/_frontend-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      build: true
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

  ci:
    name: Run CI (macOS)
    needs: [prepare]
    runs-on: macos-latest
    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Enable git long paths (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows"
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $cargoHome = Join-Path $env:RUNNER_TEMP "_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = Join-Path $env:RUNNER_TEMP "_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-${{ runner.os }}
          cache-on-failure: true
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR

      - name: Run Rust tests
        run: node scripts/test-rust.mjs

      - name: Run functional tests
        run: node scripts/test-functional.mjs

  ci-windows:
    name: Run CI (Windows)
    needs: [prepare]
    if: ${{ needs.prepare.outputs.skip_windows != 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: Voice-Wise/VoiceWise
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Enable git long paths (Windows)
        run: git config --system core.longpaths true

      - name: "Optimize I/O for Windows"
        shell: pwsh
        run: |
          $cargoHome = Join-Path $env:RUNNER_TEMP "_cargo"
          $cargoTargetDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target"
          $bunCache = Join-Path $env:RUNNER_TEMP "_bun-cache"
          New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $bunCache | Out-Null
          echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          echo "BUN_INSTALL_CACHE_DIR=$bunCache" >> $env:GITHUB_ENV

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-${{ runner.os }}
          cache-on-failure: true
          workspaces: |
            src-tauri -> target
          env-vars: |
            CARGO_HOME
            CARGO_TARGET_DIR

      - name: Run Rust tests
        run: node scripts/test-rust.mjs

      - name: Run functional tests
        run: node scripts/test-functional.mjs
